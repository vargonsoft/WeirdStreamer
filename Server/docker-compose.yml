version: '3.8'

services:
  media-server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./thumbnails:/app/thumbnails
      - /path/to/your/media:/media:ro
    environment:
      - SERVER_PORT=8080
      - DATABASE_PATH=/app/data/media.db
      - THUMBNAIL_PATH=/app/thumbnails
      - MEDIA_PATH=/media
      - JWT_SECRET=change-this-secret-key
    restart: unless-stopped
