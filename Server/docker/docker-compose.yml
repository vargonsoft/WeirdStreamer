# Runs the server in a container: make docker-compose-up
#
# make docker-config writes the two generated files this loads: the library mounts (the override
# file) and the config the container runs with (config.container.yml, from config.yml).
services:
  weirdstreamer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: weirdstreamer:latest
    ports:
      - "8080:8080"
    volumes:
      - ./config.container.yml:/app/config.yml:ro
      - ../var:/app/var
    restart: unless-stopped
